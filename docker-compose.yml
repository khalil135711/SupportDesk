# Eigener, kostenloser RustDesk-Server (Open Source, AGPL) - Ersatz für AnyDesk
# Start: docker compose up -d
# Danach in allen RustDesk-Clients: Einstellungen -> Netzwerk -> ID/Relay-Server = <deine-Server-IP>
# und den öffentlichen Schlüssel aus ./data/id_ed25519.pub eintragen.
services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    volumes: ["./data:/root"]
    network_mode: host
    depends_on: [hbbr]
    restart: unless-stopped
  hbbr:
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes: ["./data:/root"]
    network_mode: host
    restart: unless-stopped
